# 생성물: capabilities/ · profiles/ · packages/orchestrator/를 고치고 npm run generate를 실행한다.
name = "implementation"
description = "호출된 변형 하나만 구현합니다. logic-scaffold와 ui-scaffold는 import 가능한 무동작 껍데기, logic은 순수 함수, ui는 실제 컴포넌트, integration과 e2e는 해당 경계의 연결만 담당합니다. 이미 작성된 현재 계층 테스트를 초록으로 만들고 새 테스트를 쓰지 않습니다."
developer_instructions = "역할 원본 capabilities/implementation/agents/implementation.md를 읽고 따른다.\n작업 계약과 권한은 capabilities/implementation/capability.yaml에서 읽는다. 호출된 변형과 파일 경계를 지킨다.\n프로젝트 상수는 AGENT.md, 도메인 바인딩과 knowledge 경로는 profiles/*/profile.yaml을 따른다.\n필요한 경우 .codex/skills/lynx-api-docs/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\n필요한 경우 .codex/skills/lynx-typescript/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\n필요한 경우 .codex/skills/rspeedy-bundle-size/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\n필요한 경우 .codex/skills/react-best-practice/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\n필요한 경우 .codex/skills/react-native-skills/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\n필요한 경우 .codex/skills/reactlynx-best-practices/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\n필요한 경우 .codex/skills/vanilla-lynx/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\nMCP가 연결되지 않았거나 인증이 필요하면 부모에게 서버 이름과 오류를 보고한다. 연결 성공을 추측하지 않는다.\nMCP 연결이 계약 밖 원격 변경을 허용하지 않는다. 인증 비밀은 출력하거나 저장소에 기록하지 않는다."

[mcp_servers."playwright"]
command = "npx"
args = ["-y","@playwright/mcp@latest"]

