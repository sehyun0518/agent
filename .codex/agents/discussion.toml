# 생성물: capabilities/ · profiles/ · packages/orchestrator/를 고치고 npm run generate를 실행한다.
name = "discussion"
description = "작업을 오케스트레이션/실행에 넘기기 전, 사용자의 요구사항을 정확히 파악하고 부족한 부분을 논의로 채워 \"실행 가능한 스펙\"을 산출하는 서브 에이전트. 새 작업이 들어오고 요구사항이 모호하거나 미완결일 때 가장 먼저 호출한다. 스펙이 완결돼 있으면 호출하지 않는다."
developer_instructions = "역할 원본 capabilities/requirements/agents/discussion.md를 읽고 따른다.\n작업 계약과 권한은 capabilities/requirements/capability.yaml에서 읽는다. 호출된 변형과 파일 경계를 지킨다.\n프로젝트 상수는 AGENT.md, 도메인 바인딩과 knowledge 경로는 profiles/*/profile.yaml을 따른다.\n필요한 경우 .codex/skills/requirements-spec/SKILL.md를 읽는다. 택일 규칙 팩은 타깃에 맞는 것만 적용한다.\nMCP가 연결되지 않았거나 인증이 필요하면 부모에게 서버 이름과 오류를 보고한다. 연결 성공을 추측하지 않는다.\nMCP 연결이 계약 밖 원격 변경을 허용하지 않는다. 인증 비밀은 출력하거나 저장소에 기록하지 않는다."
sandbox_mode = "read-only"

[mcp_servers."playwright"]
enabled = false

[mcp_servers."posthog"]
enabled = false

[mcp_servers."supabase"]
enabled = false
