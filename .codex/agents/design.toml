# 생성물: capabilities/ · profiles/ · packages/orchestrator/를 고치고 npm run generate를 실행한다.
name = "design"
description = "기능의 디자인 토큰과 컴포넌트별 시각 스펙을 산출합니다 — 색·간격·타이포·상태·반응형. 계약 고정과 병렬로 기능 시작 단계에서 사용하세요. 컴포넌트를 직접 구현하지 않고, 구현이 소비할 토큰과 스펙만 만듭니다."
developer_instructions = "역할 원본 profiles/frontend/agents/design.md를 읽고 따른다.\n작업 계약과 권한은 profiles/frontend/profile.yaml에서 읽는다. 호출된 변형과 파일 경계를 지킨다.\n프로젝트 상수는 AGENT.md, 도메인 바인딩과 knowledge 경로는 profiles/*/profile.yaml을 따른다.\nMCP가 연결되지 않았거나 인증이 필요하면 부모에게 서버 이름과 오류를 보고한다. 연결 성공을 추측하지 않는다.\nMCP 연결이 계약 밖 원격 변경을 허용하지 않는다. 인증 비밀은 출력하거나 저장소에 기록하지 않는다."

[mcp_servers."playwright"]
command = "npx"
args = ["-y","@playwright/mcp@latest"]

[mcp_servers."posthog"]
enabled = false

[mcp_servers."supabase"]
enabled = false
