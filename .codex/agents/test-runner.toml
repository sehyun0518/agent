# 생성물: capabilities/ · profiles/ · packages/orchestrator/를 고치고 npm run generate를 실행한다.
name = "test-runner"
description = "저장소 profile이 제공한 명령으로 테스트를 실행하고, 결과를 파싱해 증거로 남깁니다. 실패가 예상한 이유인지(red 확인) 판정합니다. 테스트나 제품 코드를 수정하지 않습니다."
developer_instructions = "역할 원본 capabilities/test-execution/agents/test-runner.md를 읽고 따른다.\n작업 계약과 권한은 capabilities/test-execution/capability.yaml에서 읽는다. 호출된 변형과 파일 경계를 지킨다.\n프로젝트 상수는 AGENT.md, 도메인 바인딩과 knowledge 경로는 profiles/*/profile.yaml을 따른다.\nMCP가 연결되지 않았거나 인증이 필요하면 부모에게 서버 이름과 오류를 보고한다. 연결 성공을 추측하지 않는다.\nMCP 연결이 계약 밖 원격 변경을 허용하지 않는다. 인증 비밀은 출력하거나 저장소에 기록하지 않는다."
sandbox_mode = "read-only"

[mcp_servers."playwright"]
enabled = false

[mcp_servers."posthog"]
enabled = false

[mcp_servers."supabase"]
enabled = false
