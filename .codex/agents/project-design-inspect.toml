# 생성물: capabilities/ · profiles/ · packages/orchestrator/를 고치고 npm run generate를 실행한다.
name = "project-design-inspect"
description = "저장소를 훑어 프로젝트 상수 중 무엇이 고정됐고 무엇이 암묵이며 무엇이 없는지 가릅니다. 프로젝트를 시작하거나 기존 저장소에 하네스를 붙일 때 가장 먼저 사용하세요. 아무것도 정하지 않고 현재 상태만 근거와 함께 보고합니다."
developer_instructions = "역할 원본 profiles/frontend/agents/project-design-inspect.md를 읽고 따른다.\n작업 계약과 권한은 profiles/frontend/profile.yaml에서 읽는다. 호출된 변형과 파일 경계를 지킨다.\n프로젝트 상수는 AGENT.md, 도메인 바인딩과 knowledge 경로는 profiles/*/profile.yaml을 따른다.\nMCP가 연결되지 않았거나 인증이 필요하면 부모에게 서버 이름과 오류를 보고한다. 연결 성공을 추측하지 않는다.\nMCP 연결이 계약 밖 원격 변경을 허용하지 않는다. 인증 비밀은 출력하거나 저장소에 기록하지 않는다."
sandbox_mode = "read-only"

[mcp_servers."playwright"]
enabled = false

[mcp_servers."posthog"]
enabled = false

[mcp_servers."supabase"]
enabled = false
