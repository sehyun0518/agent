# 생성물: capabilities/ · profiles/ · packages/orchestrator/를 고치고 npm run generate를 실행한다.
name = "project-design-decide"
description = "inspect가 암묵·없음으로 판정한 축을 결정으로 만듭니다. 근거와 버린 대안과 대가를 함께 남깁니다. 골격을 만들지 않고 결정만 기록하며, 정할 수 없는 것은 무엇이 막고 있는지와 함께 보류로 남깁니다."
developer_instructions = "역할 원본 profiles/frontend/agents/project-design-decide.md를 읽고 따른다.\n작업 계약과 권한은 profiles/frontend/profile.yaml에서 읽는다. 호출된 변형과 파일 경계를 지킨다.\n프로젝트 상수는 AGENT.md, 도메인 바인딩과 knowledge 경로는 profiles/*/profile.yaml을 따른다.\nMCP가 연결되지 않았거나 인증이 필요하면 부모에게 서버 이름과 오류를 보고한다. 연결 성공을 추측하지 않는다.\nMCP 연결이 계약 밖 원격 변경을 허용하지 않는다. 인증 비밀은 출력하거나 저장소에 기록하지 않는다."

[mcp_servers."playwright"]
enabled = false

[mcp_servers."posthog"]
enabled = false

[mcp_servers."supabase"]
enabled = false
