id: git-operations
version: 1
title: Git 작업
description: >-
  상태 확인·커밋·푸시·PR을 각각 독립된 커맨드로 수행한다. 하나의 자동 게시 파이프라인이 아니다 —
  어떤 변형도 다음 변형을 호출하지 않고, 어떤 Capability도 이것들을 자동 호출하지 않는다.

# 어느 변형도 다른 Capability의 완료를 선행조건으로 두지 않는다.
# 계약 고정 직후 커밋할 수도, 리뷰 통과 후 커밋할 수도 있다. 순서는 사람이 정한다.
requires: []
produces: []

# 변형 중 가장 넓은 권한이 상한이다. 각 변형이 자기 몫으로 좁힌다.
permissions:
  filesystem: write
  network: allowlist
  destructive: true
  networkAllowlist: []

entrypoints:
  agents:
    - id: git-operator
      file: agents/git-operator.md
      description: >-
        커밋·푸시·PR 작업을 하나씩 독립적으로 수행합니다. 요청받은 하나의 작업만 하고
        다음 작업을 자동으로 이어서 하지 않습니다. 커밋 메시지나 PR 본문에 자동화 도구
        출처 문구를 넣지 않습니다.
      tools: [Read, Grep, Glob, Bash]
      modelTier: cheap
      memory: project
  hooks:
    - event: before-tool
      file: hooks/no-auto-chaining.md
      blocking: true
      description: 한 변형이 다른 변형의 명령을 실행하는 것을 막는다.
    - event: before-capability
      file: hooks/no-auto-attribution.md
      blocking: true
      description: 커밋 메시지·PR 본문에 자동 출처 문구가 들어가는 것을 막는다.

variants:
  inspect:
    title: 상태 확인
    description: >-
      읽기 전용으로 현재 상태를 확인한다. 파일 수정·staging·commit·push·PR 생성을
      하지 않는다. 다른 변형을 부르기 전에 무엇을 대상으로 하는지 먼저 보게 하는 것이
      목적이다.
    produces:
      - git.inspection
    permissions:
      filesystem: read
      network: allowlist
      destructive: false
    evidence:
      - kind: changed-files
        required: true
        artifactRequired: true
    completion:
      requiresEvidence:
        - changed-files

  commit:
    title: 커밋
    description: 스테이징된 변경을 로컬 커밋으로 만든다. push하지 않는다.
    produces:
      - git.commit-ref
    permissions:
      filesystem: write
      network: none
      destructive: false
    evidence:
      - kind: changed-files
        required: true
        artifactRequired: true
    completion:
      requiresEvidence:
        - changed-files

  push:
    title: 푸시
    description: 로컬 커밋을 원격에 올린다. PR을 만들지 않는다.
    produces:
      - git.push-ref
    permissions:
      filesystem: read
      network: allowlist
      destructive: true
    requiresApproval: true
    evidence:
      - kind: approval-record
        required: true
      - kind: policy-decision
        required: true
    completion:
      requiresEvidence:
        - approval-record
        - policy-decision
      expectedStatus:
        approval-record: granted

  pr-preview:
    title: PR 미리보기
    description: 게시하지 않고 PR 본문을 만들어 보여준다. 읽기 전용이다.
    produces:
      - git.pr-preview
    permissions:
      filesystem: read
      network: none
      destructive: false
    evidence:
      - kind: changed-files
        required: true
        artifactRequired: true
    completion:
      requiresEvidence:
        - changed-files

  pr-create:
    title: PR 생성
    description: 새 PR을 만든다. commit도 push도 하지 않는다. 기존 PR이 있으면 이걸 쓰지 않는다.
    produces:
      - git.pr-ref
    permissions:
      filesystem: read
      network: allowlist
      destructive: true
    requiresApproval: true
    evidence:
      - kind: approval-record
        required: true
      - kind: policy-decision
        required: true
    completion:
      requiresEvidence:
        - approval-record
        - policy-decision
      expectedStatus:
        approval-record: granted

  pr-update:
    title: PR 갱신
    description: 기존 PR을 갱신한다. 기존 PR이 있는데 pr-create를 쓰면 중복 PR이 생긴다.
    produces:
      - git.pr-ref
    permissions:
      filesystem: read
      network: allowlist
      destructive: true
    requiresApproval: true
    evidence:
      - kind: approval-record
        required: true
      - kind: policy-decision
        required: true
    completion:
      requiresEvidence:
        - approval-record
        - policy-decision
      expectedStatus:
        approval-record: granted

failure:
  transient:
    action: retry
    maxAttempts: 2
  precondition-unmet:
    action: return-to-producer
  contract-violation:
    action: escalate
    escalateTo: orchestrator
  policy-denied:
    action: halt

# 나가는 호출도, 들어오는 자동 진행도 둘 다 막는다.
# - autoInvoke: false  → commit이 push를 부르지 못한다
# - autoTriggerable: false → 워크플로가 Git 작업을 자동 단계로 둘 수 없다
# 검증기가 둘 다 검사한다.
chaining:
  autoInvoke: false
  autoTriggerable: false
  invokable: []

profileExtensible:
  skills: false
  agents: false
  tools: false
  hooks: true
