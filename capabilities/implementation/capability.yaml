id: implementation
title: 실제 구현
description: >-
  고정된 계약과 계층별 테스트 계획을 소비해 logic-scaffold·logic·ui-scaffold·ui·
  integration·e2e를 한 단계씩 구현한다. 두 스캐폴드를 제외한 동작 구현은 자기 계층
  테스트가 예상한 이유로 실패했다는 증거가 있어야 착수할 수 있다.
  스캐폴드는 동작을 담지 않으므로 red 증거를 요구하지 않는다 — 테스트가 대상 모듈을
  해석할 수 있게 만드는 것이 그 존재 이유다 (ADR-0011).

requires:
  - specification.contract
  - specification.test-plan
  - specification.completed

produces:
  - implementation.patch
  - implementation.summary
  - implementation.completed

permissions:
  filesystem: write
  network: none
  destructive: false

# 구현자가 자가 교정을 위해 하네스를 돌리는 것은 작업 방식이지 기록의 증거가 아니다.
# 판정 근거가 되는 테스트 결과는 test-execution이 낸다. 여기서 test.*.result를
# 선언하면 같은 증거를 두 곳이 생산해 어느 쪽이 진짜인지 알 수 없게 된다.
entrypoints:
  agents:
    - id: implementation
      file: agents/implementation.md
      description: >-
        호출된 변형 하나만 구현합니다. logic-scaffold와 ui-scaffold는 import 가능한
        무동작 껍데기, logic은 순수 함수, ui는 실제 컴포넌트, integration과 e2e는 해당
        경계의 연결만 담당합니다. 이미 작성된 현재 계층 테스트를 초록으로 만들고 새 테스트를
        쓰지 않습니다.
      tools: [Read, Grep, Glob, Bash, Write, Edit]
      modelTier: cheap
      background: true
      isolation: worktree
      memory: project
      color: green
  skills: []
  # 이관 게이트(선행 증거 검사)는 이 레이어가 소유하지 않는다.
  # 계층별 red-confirmed를 요구하는 것은 variant requires가 선언하고, 그 검사는
  # workflows/gates/require-red-evidence.md가 한다.

variants:
  # 계약이 신규 모듈을 도입하면 그 파일이 존재하기 전에는 unit 테스트가 import를 해석하지
  # 못하고, 모듈 해석 실패는 red가 아니다. 그러면 red 없이는 파일을 못 만들고 파일 없이는
  # red를 못 만드는 순환이 생긴다. UI 계층은 ui-scaffold로 이미 이 순환을 끊어놨고,
  # 이 변형이 unit 계층에 같은 것을 놓는다 (ADR-0011).
  logic-scaffold:
    title: 순수 로직 계약 스캐폴드
    # 변형 requires를 두지 않는다. 루트의 specification.contract·test-plan 외에 요구하는
    # 것이 없다는 뜻이다 — 특히 red를 요구하지 않는다. 동작을 담지 않기 때문이다.
    # 다른 변형이 여기 적는 것은 전부 자기 계층의 선행 신호다 (ui-scaffold는 test.unit.completed).
    produces: [implementation.logic-scaffold.completed]
    evidence: &implementation-evidence
      - kind: changed-files
        required: true
        artifactRequired: true
      # 계약이 모호하거나 모순되면 추측하지 않고 되돌리는 것이 원칙이다. 되돌리지
      # 않기로 했다면 그 선택을 여기 남기고 승인을 받는다 — 기록만으로는 진행할 수
      # 없다 (ADR-0014).
      - kind: contract-deviation
        required: false
        artifactRequired: true
    completion: &implementation-completion
      requiresEvidence: [changed-files]
  logic:
    title: 순수 로직 구현
    requires: [test.unit.red-confirmed]
    produces: [implementation.logic.completed]
    evidence: *implementation-evidence
    completion: *implementation-completion
  ui-scaffold:
    title: UI 계약 스캐폴드
    requires: [test.unit.completed]
    produces: [implementation.ui-scaffold.completed]
    evidence: *implementation-evidence
    completion: *implementation-completion
  ui:
    title: UI 구현
    requires: [test.ui.red-confirmed]
    produces: [implementation.ui.completed]
    evidence: *implementation-evidence
    completion: *implementation-completion
  integration:
    title: 통합 연결 구현
    requires: [test.integration.red-confirmed]
    produces: [implementation.integration.completed]
    evidence: *implementation-evidence
    completion: *implementation-completion
  e2e:
    title: 사용자 여정 구현
    requires: [test.e2e.red-confirmed]
    produces: [implementation.e2e.completed]
    evidence: *implementation-evidence
    completion: *implementation-completion

failure:
  transient:
    action: retry
    maxAttempts: 2
  precondition-unmet:
    action: return-to-producer
  contract-violation:
    action: escalate
    escalateTo: specification
  policy-denied:
    action: halt

chaining:
  autoInvoke: false

# 규칙 팩(웹/네이티브 등)은 프로파일이 택일 주입한다. 혼용은 금지다.
profileExtensible:
  skills: true
  agents: false
  tools: true
  hooks: true
