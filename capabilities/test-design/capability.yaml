id: test-design
version: 2
title: 테스트 설계
description: >-
  고정된 계층별 테스트 계획에 따라 unit·ui·integration·e2e 테스트를 서로 다른
  변형으로 작성한다. 한 호출은 한 계층만 다루며, 테스트를 실행하거나 제품 코드를
  수정하지 않는다.

requires:
  - specification.contract
  - specification.testids
  - specification.test-plan
  - specification.completed

produces: []

permissions:
  filesystem: write
  network: none
  destructive: false

entrypoints:
  agents:
    - id: tester
      file: agents/tester.md
      description: >-
        호출된 변형의 테스트 계층 하나만 작성합니다. 계층별 테스트 계획과 활성
        프로파일의 라이브러리·파일 규약을 따르고, 다른 계층의 테스트나 제품 코드는
        수정하지 않습니다.
      tools: [Read, Grep, Glob, Bash, Write, Edit]
      modelTier: cheap
      background: true
      isolation: worktree
      memory: project
      color: pink
  skills: []

variants:
  unit:
    title: 순수 함수 테스트 설계
    produces: [test-design.unit.suite, test-design.unit.completed]
    evidence: &test-design-evidence
      - kind: changed-files
        required: true
        artifactRequired: true
    completion: &test-design-completion
      requiresEvidence: [changed-files]
  ui:
    title: UI 컴포넌트 테스트 설계
    produces: [test-design.ui.suite, test-design.ui.completed]
    evidence: *test-design-evidence
    completion: *test-design-completion
  integration:
    title: 통합 테스트 설계
    produces: [test-design.integration.suite, test-design.integration.completed]
    evidence: *test-design-evidence
    completion: *test-design-completion
  e2e:
    title: E2E 테스트 설계
    produces: [test-design.e2e.suite, test-design.e2e.completed]
    evidence: *test-design-evidence
    completion: *test-design-completion

failure:
  transient:
    action: retry
    maxAttempts: 2
  precondition-unmet:
    action: return-to-producer
  contract-violation:
    action: escalate
    escalateTo: specification
  policy-denied:
    action: halt

chaining:
  autoInvoke: false

# 러너·픽스처·E2E 도구는 도메인마다 다르다. 프로파일과 저장소 profile이 준다.
profileExtensible:
  skills: true
  agents: false
  tools: true
  hooks: true
  commands: true
