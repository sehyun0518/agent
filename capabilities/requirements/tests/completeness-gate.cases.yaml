# 완결성 게이트가 반드시 이렇게 판정해야 하는 결정론적 케이스.
#
# 러너는 아직 없다 (ADR-0001 D2 — 실행 코드는 ADR-0002로 승격). 그때까지 이 파일은
# 게이트 동작의 명세이자 회귀 목록이다. 훅을 고칠 때 이 케이스들이 여전히 같은 판정을
# 내는지 사람이 대조한다.

capability: requirements
hook: hooks/completeness-gate.md
evidence: completeness-check

cases:
  - id: all-slots-filled
    given: 필수 슬롯 7개가 모두 판정 기준을 통과하고 수용 기준이 3개다.
    expect:
      status: passed

  - id: missing-scope-out
    given: scope_out이 비어 있고 "없음"이라는 명시 확인도 없다.
    expect:
      status: failed
      summaryContains: scope_out

  - id: missing-measurement
    given: measurement가 비어 있고 "없음"이라는 명시도 없다.
    expect:
      status: failed
      summaryContains: measurement
    why: 무엇을 알고 싶은지 아무도 묻지 않으면 출시 뒤에 확인할 것이 없다.

  - id: measurement-declared-none
    given: 리팩터링이라 측정할 것이 없고 measurement에 "없음"과 사유가 적혀 있다.
    expect:
      status: passed
    why: scope_out과 같다. 없다는 것을 적게 해서 침묵 생략과 가른다.

  # 수용 기준은 "구현이 됐나"이고 측정은 "실제로 쓰이나"다. 한쪽을 다른 쪽으로
  # 대신할 수 없다 (ADR-0021).
  - id: measurement-confused-with-acceptance
    given: measurement에 "버튼이 정상 동작한다"처럼 병합 전에 판정되는 항목만 적혀 있다.
    expect:
      status: failed
      summaryContains: measurement
    why: 그건 수용 기준이다. 출시 뒤에 답이 나오는 지표여야 한다.

  - id: acceptance-criteria-too-few
    given: 수용 기준이 1개뿐이다.
    expect:
      status: failed
      summaryContains: acceptance_criteria
    why: 기준 2개 미만이면 피드백 레이어가 대조할 게이트를 만들 수 없다.

  - id: acceptance-criteria-unverifiable
    given: 수용 기준이 2개지만 "사용성이 좋다" 같은 판정 불가 문장이다.
    expect:
      status: failed
      summaryContains: acceptance_criteria
    why: 글자가 들어 있다고 채워진 게 아니다. 판정 기준은 실행 가능한 구체성을 요구한다.

  - id: unconfirmed-inference
    given: '[추론] 태그가 남아 있고 스펙 비고에도 언급이 없다.'
    expect:
      status: failed
      summaryContains: 추론

  - id: design-ref-default
    given: design_ref가 "DESIGN.md 표준 따름"이고 벗어남이 없다.
    expect:
      status: passed
    why: design_ref는 사용자에게 캐묻는 슬롯이 아니라 참조 슬롯이다. 기본값으로 충족된다.

  - id: contradiction
    given: scope_in과 scope_out에 같은 항목이 들어 있다.
    expect:
      status: failed
      summaryContains: 모순
