id: requirements
version: 1
title: 요구사항 논의
description: >
  사용자 발화를 요구사항 스키마의 빈칸으로 환원하고, 필수 슬롯이 모두 채워지면
  스펙 문서를 산출한다. 레포·파일·외부 지식을 조사하지 않는다 — 입력원은 발화뿐이다.

requires: []

produces:
  - requirements.spec
  - requirements.completed

# 도구 없음. 발화 밖 정보로 슬롯을 채우는 것을 권한 수준에서 막는다.
permissions:
  filesystem: none
  network: none
  destructive: false

evidence:
  - kind: completeness-check
    required: true
    artifactRequired: true

# "완결"은 상태 플래그가 아니라 완결성 게이트 통과 증거로 판정한다.
completion:
  requiresEvidence:
    - completeness-check
  expectedStatus:
    completeness-check: passed

entrypoints:
  agents:
    - id: discussion
      file: agents/discussion.md
      description: >-
        작업을 오케스트레이션/실행에 넘기기 전, 사용자의 요구사항을 정확히 파악하고 부족한 부분을
        논의로 채워 "실행 가능한 스펙"을 산출하는 서브 에이전트. 새 작업이 들어오고 요구사항이
        모호하거나 미완결일 때 가장 먼저 호출한다. 스펙이 완결돼 있으면 호출하지 않는다.
      # 발화 밖 정보로 슬롯을 채우지 못하게 도구를 주지 않는다.
      tools: []
      modelTier: cheap
  skills:
    - contracts/requirements-spec
  hooks:
    - event: after-capability
      file: hooks/completeness-gate.md
      blocking: true
      description: 필수 슬롯·수용 기준 2개 이상·미확인 추론 0개를 검사하고 미달이면 산출을 막는다. 슬롯 목록은 requirements-spec 스킬이 소유한다.

failure:
  transient:
    action: retry
    maxAttempts: 2
  precondition-unmet:
    action: return-to-producer
  contract-violation:
    action: escalate
    escalateTo: orchestrator
  policy-denied:
    action: halt

chaining:
  autoInvoke: false

profileExtensible:
  skills: true
  agents: false
  hooks: true
