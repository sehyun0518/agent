id: test-execution
title: 테스트 실행
description: >-
  작성된 테스트를 실행하고 결과를 증거로 남긴다. unit·ui·integration·e2e는 하나의
  `test` 상태로 합치지 않고 각각 독립된 신호와 증거를 낸다. 실행 명령 자체는
  저장소 profile의 commands가 제공한다 — 공용 하네스는 명령 문자열을 담지 않는다.

requires:
  - specification.test-plan

# 루트는 아무것도 내지 않는다. 산출은 변형이 소유한다.
# 각 변형은 자기 계층의 suite를 받고 red/green 실행을 모두 담당한다. 워크플로가
# 호출 시점과 산출을 좁혀 red 실행과 green 실행을 구분한다.
produces: []

permissions:
  filesystem: read
  network: none
  destructive: false

entrypoints:
  agents:
    - id: test-runner
      file: agents/test-runner.md
      description: >-
        저장소 profile이 제공한 명령으로 테스트를 실행하고, 결과를 파싱해 증거로 남깁니다.
        실패가 예상한 이유인지(red 확인) 판정합니다. 테스트나 제품 코드를 수정하지 않습니다.
      tools: [Read, Grep, Glob, Bash]
      modelTier: cheap
      memory: project
      readonly: true
  skills: []

variants:
  unit:
    title: 단위 테스트 실행
    description: >-
      순수 함수의 입출력을 검증한다. DOM이나 컴포넌트를 포함하지 않는다.
    requires: [test-design.unit.completed, test-design.unit.suite]
    commandKey: test.unit
    produces:
      - test.unit.completed
      - test.unit.red-confirmed
    evidence:
      - kind: test.unit.result
        required: true
        artifactRequired: true
      - kind: test.unit.red-proof
        required: false
        artifactRequired: true
    completion:
      requiresEvidence:
        - test.unit.result

  ui:
    title: UI 테스트 실행
    requires: [test-design.ui.completed, test-design.ui.suite]
    commandKey: test.ui
    produces: [test.ui.completed, test.ui.red-confirmed]
    evidence:
      - kind: test.ui.result
        required: true
        artifactRequired: true
      - kind: test.ui.red-proof
        required: false
        artifactRequired: true
      - kind: test.skip-justification
        required: false
        artifactRequired: true
    completion:
      requiresEvidence: [test.ui.result]

  integration:
    title: 통합 테스트 실행
    requires: [test-design.integration.completed, test-design.integration.suite]
    commandKey: test.integration
    produces:
      - test.integration.completed
      - test.integration.red-confirmed
    evidence:
      - kind: test.integration.result
        required: true
        artifactRequired: true
      - kind: test.integration.red-proof
        required: false
        artifactRequired: true
      # 러너가 저장소 밖 환경(에뮬레이터·기기·실 서버)을 요구해 둘 수 없는 저장소가 있다.
      # 그때 문서화된 수동 절차로 검증한 결과를 여기 남긴다 — 생략이 아니므로 승인을
      # 요구하지 않는다. 성립 조건은 require-test-evidence 게이트가 정한다 (ADR-0013).
      - kind: test.integration.manual-result
        required: false
        artifactRequired: true
      - kind: test.skip-justification
        required: false
        artifactRequired: true
    completion:
      # 러너 결과이거나 수동 검증 결과이거나. 둘 중 하나면 이 계층은 검증된 것이다.
      requiresEvidence:
        - [test.integration.result, test.integration.manual-result]

  e2e:
    title: E2E 실행
    requires: [test-design.e2e.completed, test-design.e2e.suite]
    commandKey: test.e2e
    produces:
      - test.e2e.completed
      - test.e2e.red-confirmed
    evidence:
      - kind: test.e2e.result
        required: true
        artifactRequired: true
      - kind: test.e2e.red-proof
        required: false
        artifactRequired: true
      # 러너가 저장소 밖 환경(에뮬레이터·기기·실 서버)을 요구해 둘 수 없는 저장소가 있다.
      # 그때 문서화된 수동 절차로 검증한 결과를 여기 남긴다 — 생략이 아니므로 승인을
      # 요구하지 않는다. 성립 조건은 require-test-evidence 게이트가 정한다 (ADR-0013).
      - kind: test.e2e.manual-result
        required: false
        artifactRequired: true
      - kind: test.skip-justification
        required: false
        artifactRequired: true
    completion:
      # 러너 결과이거나 수동 검증 결과이거나. 둘 중 하나면 이 계층은 검증된 것이다.
      requiresEvidence:
        - [test.e2e.result, test.e2e.manual-result]

failure:
  transient:
    action: retry
    maxAttempts: 2
  precondition-unmet:
    action: return-to-producer
  contract-violation:
    action: escalate
    escalateTo: test-design
  policy-denied:
    action: halt

chaining:
  autoInvoke: false

profileExtensible:
  skills: false
  agents: false
  tools: true
  hooks: true
