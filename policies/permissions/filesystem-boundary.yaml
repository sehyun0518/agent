id: filesystem-boundary
scope: permissions
level: immutable
relaxable: false
title: 파일 시스템 경계
statement: >-
  실행자는 자신의 Capability가 선언한 permissions.filesystem 범위 밖에서 파일을
  읽거나 쓸 수 없다. filesystem:none은 어떤 파일도 읽지 않는다는 뜻이고,
  filesystem:read는 쓰기 도구를 가질 수 없다는 뜻이다. 각 에이전트의 도구 목록은
  자기 Capability의 의미 권한을 초과할 수 없다.
rationale: >-
  프롬프트에 "레포를 조사하지 않는다"고 적는 것과 도구를 주지 않는 것은 다르다.
  앞의 것은 지켜지지 않아도 아무 일이 일어나지 않는다. 이 정책이 그 차이를 메운다.
appliesTo: ["*"]
enforcement:
  validator: tools-within-permissions
  requiresEvidence:
    - policy-decision
