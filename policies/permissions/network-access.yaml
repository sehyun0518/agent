id: network-access
scope: permissions
level: immutable
relaxable: false
title: 외부 네트워크 접근 제한
statement: >-
  permissions.network가 none인 Capability는 네트워크 도구를 가질 수 없다.
  allowlist면 networkAllowlist에 등재된 호스트로만 나갈 수 있다. 프로파일은 이
  범위를 좁힐 수만 있고 넓힐 수 없다.
rationale: >-
  외부로 나가는 요청은 되돌릴 수 없다. 한번 나간 데이터는 캐시되거나 색인될 수 있고,
  나중에 지워도 되돌아오지 않는다.
appliesTo: ["*"]
enforcement:
  validator: network-within-allowlist
  requiresEvidence:
    - policy-decision
