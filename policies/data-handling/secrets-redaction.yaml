id: secrets-redaction
scope: data-handling
level: immutable
relaxable: false
title: 비밀정보 제거
statement: >-
  증거·요약·텔레메트리 속성·커밋 메시지·PR 본문 어디에도 자격증명, API 키, 토큰,
  비밀번호, 개인 접근 토큰을 남기지 않는다. 발견하면 값 대신 존재 사실만 기록한다.
rationale: >-
  증거는 오래 남고 여러 곳으로 복제된다. 실행 로그 하나에 들어간 키는 그 로그를
  읽는 모든 경로로 퍼진다.
appliesTo: ["*"]
enforcement:
  hooks:
    - event: on-evidence
      blocking: true
    - event: before-tool
      blocking: true
  requiresEvidence:
    - policy-decision
