id: sensitive-data-storage
scope: data-handling
level: immutable
relaxable: false
title: 민감 데이터 저장 제한
statement: >-
  개인 식별 정보와 고객 데이터를 증거 아티팩트나 픽스처에 저장하지 않는다.
  테스트에 필요하면 합성 데이터를 쓴다. 실행 출력에 섞여 들어온 민감 데이터는
  아티팩트로 기록하기 전에 제거한다.
rationale: >-
  증거는 감사 목적으로 보존되므로 삭제 요구를 만족시키기 어려워진다. 애초에 넣지
  않는 것이 유일하게 확실한 방법이다.
appliesTo: ["*"]
enforcement:
  hooks:
    - event: on-evidence
      blocking: true
  requiresEvidence:
    - policy-decision
