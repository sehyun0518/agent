id: review
version: 1
title: 검토 전용
description: >-
  이미 만들어진 변경을 판정만 한다. 구현하지 않으므로 red 게이트가 없다. 대신
  **테스트 증거가 없으면 판정하지 않는다** — 없는 증거를 review가 대신 만들지 않는다.

# 이 흐름은 앞선 실행이 남긴 산출 위에서 시작한다. 흐름 안에 생산자가 없는 것이
# 결함이 아니라 이 워크플로의 정의다. 다만 충족되지 않으면 되돌릴 곳이 없으므로,
# 사람이 흐름 밖에서 채운 뒤 다시 시작해야 한다 (ADR-0014).
assumes:
  - specification.completed
  - specification.contract
  - specification.test-plan
  - test-design.unit.completed
  - test-design.unit.suite
  - test-design.ui.completed
  - test-design.ui.suite
  - test-design.integration.completed
  - test-design.integration.suite
  - test-design.e2e.completed
  - test-design.e2e.suite
  - implementation.completed
  - implementation.patch

steps:
  - id: unit
    capability: test-execution
    variant: unit
    trigger: manual
    produces:
      - test.unit.completed
    note: >-
      검토 대상 변경에 대해 테스트를 돌린다. 사람이 시작하는 진입점이다 —
      이 워크플로에는 선행 구현 단계가 없다.

  - id: ui
    capability: test-execution
    variant: ui
    trigger: automatic
    dependsOn: [unit]
    expect:
      - evidence: test.unit.result
        status: passed
        from: unit
    produces:
      - test.ui.completed
    skippable:
      evidenceOnSkip: test.skip-justification
      reasonRequired: true
      approvalRequired: false

  - id: integration
    capability: test-execution
    variant: integration
    trigger: automatic
    dependsOn: [ui]
    expectAnyOf:
      - conditions: [{ evidence: test.ui.result, status: passed, from: ui }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: ui }]
    produces:
      - test.integration.completed
    skippable:
      evidenceOnSkip: test.skip-justification
      reasonRequired: true
      approvalRequired: true

  - id: e2e
    capability: test-execution
    variant: e2e
    trigger: automatic
    dependsOn: [integration]
    expectAnyOf:
      - conditions: [{ evidence: test.integration.result, status: passed, from: integration }]
      # 러너 없이 문서화된 절차로 검증한 경우. 생략이 아니라 다른 방법의 검증이다 (ADR-0013).
      - conditions: [{ evidence: test.integration.manual-result, status: passed, from: integration }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: integration }]
    produces:
      - test.e2e.completed
    skippable:
      evidenceOnSkip: test.skip-justification
      reasonRequired: true
      approvalRequired: true

  - id: review
    capability: review
    gate: require-test-evidence
    trigger: automatic
    dependsOn: [unit, ui, integration, e2e]
    expect:
      - evidence: test.unit.result
        status: passed
        from: unit
    produces:
      - review.verdict
      - review.completed
    note: >-
      계약 대조와 증거 소비만 한다. 코드를 고치지 않고, 지적은 프로파일의 routing이
      정한 소유자로 라우팅한다.

  - id: inspect
    capability: git-operations
    variant: inspect
    trigger: manual
    produces:
      - git.inspection
    note: 읽기 전용. 다른 Git 작업 전에 대상을 확인한다.

  - id: pr-preview
    capability: git-operations
    variant: pr-preview
    trigger: manual
    produces:
      - git.pr-preview
    note: 판정 결과를 PR 본문으로 정리해 보여주기만 한다. 게시하지 않는다.
