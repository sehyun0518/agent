id: bugfix
title: 계층별 TDD 버그 수정
description: >-
  버그를 가장 낮은 책임 경계에서 먼저 재현하고 unit부터 E2E까지 필요한 계층을
  red-green으로 진행한다. 기존 계약의 변경이 없어도 테스트 계획은 고정한다.

steps:
  - id: requirements
    capability: requirements
    trigger: manual
    produces: [requirements.spec, requirements.completed]

  - id: specification
    capability: specification
    trigger: automatic
    dependsOn: [requirements]
    expect: [{ evidence: completeness-check, status: passed, from: requirements }]
    produces: [specification.contract, specification.testids, specification.test-plan, specification.completed]

  # 스캐폴드가 재현 테스트보다 앞에 온다. change와 같은 자리, 같은 이유다 (ADR-0011).
  # 버그 수정이 신규 모듈을 도입하는 경우 — 날짜 정규화 함수를 뽑아내는 식 — 그 파일이
  # 없는 동안 재현 테스트가 import를 해석하지 못하고, 모듈 해석 실패는 red가 아니다.
  # ui-scaffold가 이미 이 흐름에 있는 것과도 맞춘다.
  - id: logic-scaffold
    capability: implementation
    variant: logic-scaffold
    trigger: automatic
    dependsOn: [specification]
    expect:
      - { evidence: contract-diff, status: recorded, from: specification }
    produces: [implementation.patch, implementation.summary, implementation.completed, implementation.logic-scaffold.completed]

  - id: unit-reproduction
    capability: test-design
    variant: unit
    trigger: automatic
    dependsOn: [logic-scaffold]
    expect: [{ evidence: changed-files, status: recorded, from: logic-scaffold }]
    produces: [test-design.unit.suite, test-design.unit.completed]

  - id: unit-red
    capability: test-execution
    variant: unit
    trigger: automatic
    dependsOn: [unit-reproduction]
    expect: [{ evidence: changed-files, status: recorded, from: unit-reproduction }]
    produces: [test.unit.red-confirmed]

  - id: logic-fix
    capability: implementation
    variant: logic
    gate: require-red-evidence
    trigger: automatic
    dependsOn: [unit-red]
    expect: [{ evidence: test.unit.red-proof, status: confirmed, from: unit-red }]
    produces: [implementation.patch, implementation.summary, implementation.completed, implementation.logic.completed]

  - id: unit-green
    capability: test-execution
    variant: unit
    trigger: automatic
    dependsOn: [logic-fix]
    expect: [{ evidence: changed-files, status: recorded, from: logic-fix }]
    produces: [test.unit.completed]

  - id: ui-scaffold
    capability: implementation
    variant: ui-scaffold
    trigger: automatic
    dependsOn: [unit-green]
    expect: [{ evidence: test.unit.result, status: passed, from: unit-green }]
    produces: [implementation.patch, implementation.summary, implementation.completed, implementation.ui-scaffold.completed]
    skippable: &ui-skip
      evidenceOnSkip: test.skip-justification
      reasonRequired: true
      approvalRequired: false

  - id: ui-reproduction
    capability: test-design
    variant: ui
    trigger: automatic
    dependsOn: [ui-scaffold]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: ui-scaffold }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: ui-scaffold }]
    produces: [test-design.ui.suite, test-design.ui.completed]
    skippable: *ui-skip

  - id: ui-red
    capability: test-execution
    variant: ui
    trigger: automatic
    dependsOn: [ui-reproduction]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: ui-reproduction }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: ui-reproduction }]
    produces: [test.ui.red-confirmed]
    skippable: *ui-skip

  - id: ui-fix
    capability: implementation
    variant: ui
    gate: require-red-evidence
    trigger: automatic
    dependsOn: [ui-red]
    expectAnyOf:
      - conditions: [{ evidence: test.ui.red-proof, status: confirmed, from: ui-red }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: ui-red }]
    produces: [implementation.patch, implementation.summary, implementation.completed, implementation.ui.completed]
    skippable: *ui-skip

  - id: ui-green
    capability: test-execution
    variant: ui
    trigger: automatic
    dependsOn: [ui-fix]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: ui-fix }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: ui-fix }]
    produces: [test.ui.completed]
    skippable: *ui-skip

  - id: integration-reproduction
    capability: test-design
    variant: integration
    trigger: automatic
    dependsOn: [ui-green]
    expectAnyOf:
      - conditions: [{ evidence: test.ui.result, status: passed, from: ui-green }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: ui-green }]
    produces: [test-design.integration.suite, test-design.integration.completed]
    skippable: &integration-skip
      evidenceOnSkip: test.skip-justification
      reasonRequired: true
      approvalRequired: true

  - id: integration-red
    capability: test-execution
    variant: integration
    trigger: automatic
    dependsOn: [integration-reproduction]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: integration-reproduction }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: integration-reproduction }]
    produces: [test.integration.red-confirmed]
    skippable: *integration-skip

  - id: integration-fix
    capability: implementation
    variant: integration
    gate: require-red-evidence
    trigger: automatic
    dependsOn: [integration-red]
    expectAnyOf:
      - conditions: [{ evidence: test.integration.red-proof, status: confirmed, from: integration-red }]
      # red가 관찰되지 않은 경우. 선행 계층이 이 협력을 이미 만들어 첫 실행부터 통과한다.
      # 생략이 아니다 — 테스트를 썼고 돌렸고 통과했다. 성립 조건은 게이트가 정한다 (ADR-0012).
      - conditions: [{ evidence: test.integration.red-proof, status: moot, from: integration-red }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: integration-red }]
    produces: [implementation.patch, implementation.summary, implementation.completed, implementation.integration.completed]
    skippable: *integration-skip

  - id: integration-green
    capability: test-execution
    variant: integration
    trigger: automatic
    dependsOn: [integration-fix]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: integration-fix }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: integration-fix }]
    produces: [test.integration.completed]
    skippable: *integration-skip

  - id: e2e-reproduction
    capability: test-design
    variant: e2e
    trigger: automatic
    dependsOn: [integration-green]
    expectAnyOf:
      - conditions: [{ evidence: test.integration.result, status: passed, from: integration-green }]
      # 러너 없이 문서화된 절차로 검증한 경우. 생략이 아니라 다른 방법의 검증이다 (ADR-0013).
      - conditions: [{ evidence: test.integration.manual-result, status: passed, from: integration-green }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: integration-green }]
    produces: [test-design.e2e.suite, test-design.e2e.completed]
    skippable: &e2e-skip
      evidenceOnSkip: test.skip-justification
      reasonRequired: true
      approvalRequired: true

  - id: e2e-red
    capability: test-execution
    variant: e2e
    trigger: automatic
    dependsOn: [e2e-reproduction]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: e2e-reproduction }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: e2e-reproduction }]
    produces: [test.e2e.red-confirmed]
    skippable: *e2e-skip

  - id: e2e-fix
    capability: implementation
    variant: e2e
    gate: require-red-evidence
    trigger: automatic
    dependsOn: [e2e-red]
    expectAnyOf:
      - conditions: [{ evidence: test.e2e.red-proof, status: confirmed, from: e2e-red }]
      # red가 관찰되지 않은 경우. 선행 계층이 이 협력을 이미 만들어 첫 실행부터 통과한다.
      # 생략이 아니다 — 테스트를 썼고 돌렸고 통과했다. 성립 조건은 게이트가 정한다 (ADR-0012).
      - conditions: [{ evidence: test.e2e.red-proof, status: moot, from: e2e-red }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: e2e-red }]
    produces: [implementation.patch, implementation.summary, implementation.completed, implementation.e2e.completed]
    skippable: *e2e-skip

  - id: e2e-green
    capability: test-execution
    variant: e2e
    trigger: automatic
    dependsOn: [e2e-fix]
    expectAnyOf:
      - conditions: [{ evidence: changed-files, status: recorded, from: e2e-fix }]
      - conditions: [{ evidence: test.skip-justification, status: recorded, from: e2e-fix }]
    produces: [test.e2e.completed]
    skippable: *e2e-skip

  # 문서 — 판정은 계약 고정 단계가 했고 여기서는 실행만 한다.
  - id: documentation
    capability: documentation
    trigger: automatic
    dependsOn: [unit-green, ui-green, integration-green, e2e-green]
    expectAnyOf:
      - conditions: [{ evidence: documentation-impact, status: required, from: specification }]
      - conditions: [{ evidence: documentation-impact, status: not-applicable, from: specification }]
    produces: [documentation.changeset, documentation.completed]
    skippable:
      evidenceOnSkip: documentation.skip-justification
      reasonRequired: true
      approvalRequired: false

  - id: review
    capability: review
    gate: [require-test-evidence, require-documentation-evidence]
    trigger: automatic
    dependsOn: [documentation]
    # 문서 단계는 생략될 수 있으므로 결과와 생략 기록 둘 다 전이 근거가 된다.
    # unit 통과는 어느 쪽에서도 빠지지 않는다 — 생략할 수 없는 유일한 계층이다.
    expectAnyOf:
      - conditions:
          - { evidence: test.unit.result, status: passed, from: unit-green }
          - { evidence: changed-files, status: recorded, from: documentation }
      - conditions:
          - { evidence: test.unit.result, status: passed, from: unit-green }
          - { evidence: documentation.skip-justification, status: recorded, from: documentation }
    produces: [review.verdict, review.completed]

  - { id: inspect, capability: git-operations, variant: inspect, trigger: manual, produces: [git.inspection] }
  - { id: commit, capability: git-operations, variant: commit, trigger: manual, produces: [git.commit-ref] }
  - { id: push, capability: git-operations, variant: push, trigger: manual, produces: [git.push-ref] }
  - { id: pr-create, capability: git-operations, variant: pr-create, trigger: manual, produces: [git.pr-ref] }
  - { id: pr-update, capability: git-operations, variant: pr-update, trigger: manual, produces: [git.pr-ref] }
